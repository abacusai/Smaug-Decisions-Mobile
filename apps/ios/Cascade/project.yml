# XcodeGen spec: `xcodegen generate` -> Cascade.xcodeproj (../build.sh does this). Needs Frameworks/CLiteRTLM.xcframework and
# GemmaModelConstraintProvider.xcframework (../runtime/build_runtime_ios.sh) and the Smaug-Audio-Decisions-0.7B Core ML units in
# Cascade/Resources (build.sh links them in).
name: Cascade
options:
  bundleIdPrefix: ai.abacus
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1"
    COREML_CODEGEN_LANGUAGE: None
    # The CLiteRTLM simulator slice is arm64 only (Apple-silicon Macs).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  Cascade:
    type: application
    platform: iOS
    sources:
      - path: Cascade
        excludes: [Info.plist, Cascade.entitlements]
    info:
      path: Cascade/Info.plist
      properties:
        CFBundleDisplayName: Cascade
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Records up to ten seconds of audio so the on-device models can decide about it.
        # Documents shows up in Finder (device) and the Files app, so a Smaug-Decisions file can be copied in.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # Inter, the ChatLLM app's typeface (Fonts/LICENSE.txt)
        UIAppFonts: [Inter_18pt-Regular.ttf, Inter_18pt-Medium.ttf, Inter_18pt-SemiBold.ttf, Inter_18pt-Bold.ttf]
    entitlements:
      path: Cascade/Cascade.entitlements
      properties:
        # Raise the jetsam limit where the OS allows it (some device models only), and the virtual address space for the
        # memory-mapped 3.45 GB Smaug-Decisions file. Device builds only; a Personal Team may reject them (build with CODE_SIGN_ENTITLEMENTS=).
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        SWIFT_OBJC_BRIDGING_HEADER: Cascade/Big/Shim/Cascade-Bridging-Header.h
        GCC_C_LANGUAGE_STANDARD: gnu11
        # Keep the bundled example PNG byte-identical (Xcode's pngcrush would rewrite it as Apple's CgBI PNG).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
    dependencies:
      - framework: Frameworks/CLiteRTLM.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/GemmaModelConstraintProvider.xcframework
        embed: true
        codeSign: true
  CascadeTests:
    # Hostless logic tests: routing, confidence, prompts, tokenizer segmentation, device policy (no models, no runtime).
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CascadeTests
      - path: Cascade/Big/Prompt.swift
      - path: Cascade/Big/Readout.swift
      - path: Cascade/Core/Router.swift
      - path: Cascade/Core/DevicePolicy.swift
      - path: Cascade/Core/Memory.swift
      - path: Cascade/Core/Types.swift
      - path: Cascade/Core/CascadeData.swift
      - path: Cascade/Fast/FastEngine.swift
      - path: Cascade/Fast/EmbeddingTable.swift
      - path: Cascade/Core/ModelChoice.swift
      - path: Cascade/Fast/MelFrontEnd.swift
      - path: Cascade/Fast/FastTokenizer.swift
      - path: Cascade/Resources/models_manifest.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.abacus.CascadeTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cascade:
    build:
      targets:
        Cascade: all
    run:
      config: Debug
  CascadeTests:
    build:
      targets:
        CascadeTests: all
    test:
      config: Debug
      targets:
        - CascadeTests
